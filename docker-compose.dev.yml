name: fern-dev

services:
  postgres:
    image: postgres:18.3-alpine
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_DB: fern
      POSTGRES_USER: fern
      POSTGRES_PASSWORD: fern
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres-data:/var/lib/postgresql]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fern]
      interval: 5s
      timeout: 5s
      retries: 20
  zero-cache:
    image: rocicorp/zero:1.9.0
    environment:
      ZERO_UPSTREAM_DB: postgres://fern:fern@postgres:5432/fern
      ZERO_CVR_DB: postgres://fern:fern@postgres:5432/fern
      ZERO_CHANGE_DB: postgres://fern:fern@postgres:5432/fern
      ZERO_REPLICA_FILE: /data/replica.db
      ZERO_ADMIN_PASSWORD: fern-local
      ZERO_QUERY_URL: http://host.docker.internal:5173/api/zero/query
      ZERO_MUTATE_URL: http://host.docker.internal:5173/api/zero/mutate
      ZERO_ENABLE_CRUD_MUTATIONS: 'false'
      ZERO_APP_PUBLICATIONS: fern_data
    ports: ['127.0.0.1:4848:4848']
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes: [zero-data:/data]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD, curl, -f, http://localhost:4848/keepalive]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
volumes:
  postgres-data:
  zero-data:
